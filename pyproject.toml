[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "scancraft"
version = "0.2.0"
description = "Convert triangle meshes (STL/OBJ/PLY/3MF) into clean, watertight B-rep solids exported as STEP."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "trimesh>=4.0",
    "networkx>=3.0",
    "cadquery-ocp>=7.7",
]

[project.optional-dependencies]
test = ["pytest>=7"]
desktop-build = ["pyinstaller==6.22.3"]

[project.scripts]
scancraft = "scancraft.cli:main"
scancraft-gui = "scancraft.gui:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
